<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Millionaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=Heebo:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --nav-h:60px;
  --display:'Bricolage Grotesque','Secular One','Heebo','Noto Sans Arabic',system-ui,'Segoe UI',Arial,sans-serif;
  --text:'DM Sans','Heebo','Noto Sans Arabic',system-ui,'Segoe UI',Arial,sans-serif;
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --ink:#0F172A;
  --ink-2:#64748B;
  --line:#E2E8F0;
  --brand:#1E3A8A;
  --on-brand:#FFFFFF;
  --slab:#FFFFFF;
  --slab-soft:#64748B;
  --track:#E2E8F0;
  --coin:#2563EB;
  --coin-ink:#FFFFFF;
  --inc:#16A34A;
  --exp:#DC2626;
  --shadow:0 6px 18px rgba(0,0,0,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F172A;--surface:#1E293B;--ink:#F8FAFC;--ink-2:#94A3B8;--line:#334155;--brand:#3B82F6;--on-brand:#FFFFFF;--slab:#1E293B;--slab-soft:#94A3B8;--track:#334155;--coin:#3B82F6;--coin-ink:#FFFFFF;--inc:#22C55E;--exp:#F87171;--shadow:0 6px 18px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0F172A;--surface:#1E293B;--ink:#F8FAFC;--ink-2:#94A3B8;--line:#334155;--brand:#3B82F6;--on-brand:#FFFFFF;--slab:#1E293B;--slab-soft:#94A3B8;--track:#334155;--coin:#3B82F6;--coin-ink:#FFFFFF;--inc:#22C55E;--exp:#F87171;--shadow:0 6px 18px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{font-synthesis:none;margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.5}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.slab :focus-visible,.ob :focus-visible{outline-color:#fff}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.vh{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}

.app{max-width:480px;margin:0 auto;padding-bottom:calc(var(--nav-h) + 96px)}
.pad{padding:0 20px}
h1,h2,h3,p{margin:0}
.h2{font-family:var(--display);font-weight:700;font-size:22px;margin:26px 0 12px}
.muted{color:var(--ink-2)}
.small{font-size:14px}

/* top bar (money, stats) */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 20px}
.topbar .t{font-family:var(--display);font-weight:700;font-size:22px}
.topbar .b{font-size:14px;color:var(--ink-2);text-align:end;line-height:1.2}
.topbar .b strong{display:block;font-size:20px;color:var(--ink);font-family:var(--display);font-weight:700}

/* home slab */
.slab{background:var(--slab);color:#fff;padding:20px 20px 26px;border-radius:0 0 28px 28px}
.slab-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.greet{color:var(--slab-soft)}
.uname{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.2}
.bal-label{margin-top:18px;color:var(--slab-soft);font-size:14px}
.bal{font-family:var(--display);font-weight:800;font-size:clamp(44px,15vw,64px);line-height:1.05;margin:2px 0 22px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:inherit}
.slab .icon-btn{background:rgba(255,255,255,.16);color:#fff}
.row .icon-btn{color:var(--ink-2)}

/* ladder */
.ladder{position:relative;padding:0 8px;margin-bottom:10px}
.track{position:relative;height:10px;border-radius:999px;background:var(--track)}
.fill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px;background:var(--coin);transition:width .6s ease}
.tick{position:absolute;top:50%;width:16px;height:16px;margin-top:-8px;margin-inline-start:-8px;border-radius:50%;background:var(--slab);border:3px solid var(--track)}
.tick.hit{background:var(--coin);border-color:var(--coin)}
.tick-labels{position:relative;height:22px;margin-top:10px}
.tick-labels span{position:absolute;top:0;width:56px;margin-inline-start:-28px;text-align:center;font-size:13px;color:var(--slab-soft)}
.ladder-note{color:#fff;font-weight:500;margin-top:6px}
.goal-note{color:var(--slab-soft);font-size:13px;margin-top:4px}

/* activity */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:500}
.pill[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.panel{margin-top:16px;padding:14px 16px;background:var(--surface);border-inline-start:4px solid var(--coin);border-start-start-radius:4px;border-end-start-radius:4px;border-start-end-radius:14px;border-end-end-radius:14px}
.panel h3{font-size:17px;margin-bottom:8px}
.panel ol{margin:0;padding-inline-start:22px}
.panel li{margin-bottom:6px}
.panel .foot{margin-top:10px;font-size:13px;color:var(--ink-2)}

/* lists */
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-what{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-cat{font-size:14px;color:var(--ink-2)}
.amt{font-weight:700}
.amt.inc{color:var(--inc)}
.amt.exp{color:var(--exp)}
.day{font-size:14px;font-weight:500;color:var(--ink-2);margin:22px 0 2px}
.link{background:none;border:0;padding:8px 0;color:var(--brand);font-weight:700}
.empty{padding:28px 0;text-align:start}
.empty p{margin-bottom:14px;color:var(--ink-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:14px;border:0;background:var(--brand);color:#fff;font-weight:700}
.btn.block{display:flex;width:100%}
.btn.coin{background:var(--coin);color:var(--coin-ink)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--exp);border:1.5px solid var(--exp)}

/* nav + fab */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav button{flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:var(--ink-2);font-size:13px}
.nav button[aria-current="page"]{color:var(--brand);font-weight:700}
.fab{position:fixed;z-index:21;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);inset-inline-end:calc(50% - min(50vw,240px) + 16px);height:52px;padding:0 20px;border-radius:999px;border:0;background:var(--brand);color:#fff;display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:var(--shadow)}

/* stats */
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--line)}
.seg button,.seg label{flex:1;position:relative}
.seg button{min-height:42px;border:0;border-radius:9px;background:transparent;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700}
.seg label span{display:block;min-height:42px;line-height:42px;text-align:center;border-radius:9px;font-weight:500;cursor:pointer}
.seg input:checked + span{background:var(--surface);font-weight:700}
.seg input:focus-visible + span{outline:3px solid var(--brand);outline-offset:2px}
.range-title{margin:18px 0 10px;font-weight:700}
.totals{display:flex;margin-bottom:8px}
.totals div{flex:1;padding:4px 12px;border-inline-start:1px solid var(--line)}
.totals div:first-child{border-inline-start:0;padding-inline-start:0}
.totals .k{font-size:14px;color:var(--ink-2)}
.totals .v{font-family:var(--display);font-weight:700;font-size:20px}
.v.inc{color:var(--inc)}.v.exp{color:var(--exp)}
.chart{width:100%;height:auto;display:block;margin-top:14px}
.chart .b-inc{fill:var(--inc)}
.chart .b-exp{fill:var(--exp)}
.chart .base{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--ink-2);font-size:10px;font-family:var(--text)}
.legend{display:flex;gap:16px;font-size:14px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
.cat{margin:12px 0}
.cat-top{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}
.cat-bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.cat-bar i{display:block;height:100%;border-radius:999px}
.cat-bar i.inc{background:var(--inc)}
.cat-bar i.exp{background:var(--exp)}
.disclaimer{margin-top:30px;font-size:13px;color:var(--ink-2)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,14,32,.55);z-index:40}
.sheet{position:fixed;z-index:41;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);max-height:90dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h2{font-family:var(--display);font-weight:700;font-size:22px}
.field{display:block;margin-top:16px}
.field > span{display:block;font-weight:500;margin-bottom:6px}
.input{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.input.big{min-height:60px;font-family:var(--display);font-weight:700;font-size:30px;text-align:start}
.chip-group{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip span{display:block;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:500;cursor:pointer}
.chip input:checked + span{background:var(--brand);border-color:var(--brand);color:#fff}
.chip input:focus-visible + span{outline:3px solid var(--brand);outline-offset:2px}
.err{color:var(--exp);font-weight:500;margin-top:12px;min-height:0}
.err:empty{display:none}
.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 80px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:var(--coin);font-weight:700;padding:4px}

/* onboarding */
.ob{background:var(--slab);color:#fff;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.ob-in{max-width:480px;width:100%;margin:0 auto;padding:28px 24px 32px;display:flex;flex-direction:column;flex:1}
.dots{display:flex;gap:6px;margin-bottom:36px}
.dots i{width:22px;height:5px;border-radius:99px;background:var(--track)}
.dots i.on{background:var(--coin)}
.ob h1{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.2;margin-bottom:10px}
.ob p{color:var(--slab-soft)}
.ob .input{background:#fff;color:#141A33;border-color:#fff}
.ob .field > span{color:#fff}
.ob .err{color:#FFD3D5}
.ob .check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;color:#fff}
.ob .check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--coin)}
.ob .spacer{flex:1;min-height:24px}
.ob .back{align-self:flex-start;background:none;border:0;color:#fff;padding:12px 0;font-weight:500;margin-top:8px}
.ob .note{font-size:13px;margin-top:14px}

@media (prefers-reduced-motion: reduce){
  .fill{transition:none}
  .sheet{animation:none}
}

select.input{appearance:auto;padding-inline:10px}
.ob select.input{color:#141A33}
.langsw{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.langsw button{min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.45);background:transparent;color:#fff;font-weight:500}
.langsw button[aria-pressed="true"]{background:#fff;color:#141A33;border-color:#fff}
.dots{margin-bottom:28px}
.small{font-size:14px}

.nav button{font-size:12px}
.path-row{display:flex;flex-direction:column;gap:6px;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 0}
.path-row .t2{font-family:var(--display);font-weight:700;font-size:19px}
.cat-bar i.brand{background:var(--brand)}

.nav button{font-size:11px;padding:0 2px}
.nav button svg{width:20px;height:20px}
input[type=file].input{padding:10px 14px;min-height:48px;height:auto}
.check2{display:flex;gap:10px;align-items:flex-start;margin-top:16px}
.check2 input{flex:none;width:22px;height:22px;margin:2px 0 0;accent-color:var(--brand)}
.vid-row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0}
.thumb{flex:none;width:112px;aspect-ratio:16/9;border-radius:12px;background:var(--slab);color:#fff;display:flex;align-items:center;justify-content:center}
.vid-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.vid-info .t2{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.3}
.vmeta{display:flex;gap:12px;flex-wrap:wrap}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--line);color:var(--ink-2);margin-inline-start:6px;vertical-align:middle}
.player{display:block;width:100%;aspect-ratio:16/9;border-radius:14px;background:#000}
.player.ph{background:var(--slab);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.like-btn{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;display:inline-flex;align-items:center;gap:8px}
.like-btn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.like-btn[aria-pressed="true"] svg{fill:currentColor}
.cmt-form{display:flex;gap:8px}
.cmt-form .input{flex:1;min-width:0}
.cmt{padding:12px 0;border-bottom:1px solid var(--line)}
.cmt-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cmt-actions{display:flex;gap:14px}
.cmt-actions button{background:none;border:0;padding:6px 0;color:var(--ink-2);font-size:14px;font-weight:500}

.goal{padding:16px 0;border-bottom:1px solid var(--line)}
.goal-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.goal-actions{display:flex;gap:14px;margin-top:10px;align-items:center}
.goal-note{margin-top:14px}
.nav button{font-size:10.5px;line-height:1.15;text-align:center}
.prof{text-align:center;position:relative;padding-top:28px}
.prof-gear{position:absolute;top:14px;inset-inline-end:14px}
.avatar-btn{background:none;border:0;padding:0;border-radius:50%;cursor:pointer}
.avatar{width:136px;height:136px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.35);display:block;margin:0 auto}
.avatar.ph{display:flex;align-items:center;justify-content:center;background:var(--coin);color:var(--coin-ink);font-family:var(--display);font-weight:800;font-size:58px}
.prof .uname{margin-top:14px}
.prof-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.pbtn{min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.45);background:transparent;color:#fff;font-weight:500}
#splash{position:fixed;inset:0;z-index:100;background:#fff;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s ease;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
#splash .mark{width:84px;height:84px;border-radius:50%;background:#FFC83D;color:#2A2100;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:46px;animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both}
#splash .word{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(38px,12vw,56px);letter-spacing:-.01em;color:#000;animation:rise .6s .15s ease both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#splash .mark,#splash .word{animation:none}#splash{transition:none}}

/* black & white overrides */
.slab,.ob{color:var(--ink)}
.slab .icon-btn{background:rgba(128,128,128,.18);color:var(--ink)}
.slab :focus-visible,.ob :focus-visible{outline-color:var(--brand)}
.ladder-note{color:var(--ink)}
.pill[aria-pressed="true"],.btn,.fab,.chip input:checked + span,.like-btn[aria-pressed="true"]{color:var(--on-brand)}
.btn.ghost{color:var(--ink)}
.ob{background:var(--bg)}
.ob .input,.ob select.input{background:var(--surface);color:var(--ink);border-color:var(--ink-2)}
.ob .field > span,.ob .check,.ob .back{color:var(--ink)}
.langsw button{border-color:var(--ink-2);color:var(--ink)}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.thumb,.player.ph{color:var(--ink)}
.avatar{border:4px solid var(--line)}
.pbtn{border-color:var(--ink-2);color:var(--ink)}
.link{color:var(--ink);text-decoration:underline}
.cmt{display:flex;gap:10px;align-items:flex-start}
.cmt.reply{margin-inline-start:46px}
.cmt-body{flex:1;min-width:0}
.cmt-body p{overflow-wrap:anywhere}
.cav{flex:none;width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.cmt.reply .cav{width:30px;height:30px;font-size:14px}
.badge.adm{background:var(--ink);color:var(--bg)}
.reply-bar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:6px}
.reply-bar:empty{display:none}
.reply-bar .link{padding:0}
.c-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0}
.c-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.c-name{font-family:var(--display);font-weight:700;font-size:18px;overflow-wrap:anywhere}
.badge.v-fit,.badge.v-maybe,.badge.v-wait{margin:0;flex:none;background:transparent;border:1.5px solid currentColor}
.badge.v-fit{color:var(--inc)}.badge.v-maybe{color:var(--ink-2)}.badge.v-wait{color:var(--exp)}
.verdict{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.2;margin-top:8px}
.verdict.v-fit{color:var(--inc)}.verdict.v-wait{color:var(--exp)}
.reasons{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.ans{list-style:none;margin:0;padding:0}
.ans li{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.q-title{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.25;margin:16px 0 20px}
.qbar{height:6px;border-radius:999px;background:var(--line);margin-top:6px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--ink);transition:width .3s ease}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:60px;padding:14px 18px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:start;font-size:18px;font-weight:500;line-height:1.3}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (prefers-reduced-motion:reduce){.qbar i{transition:none}}

/* palette v2 */
.slab{box-shadow:0 1px 0 var(--line),0 8px 24px rgba(15,23,42,.06)}
.h2,.uname,.verdict,.q-title,.c-name,.bal,.topbar .t{color:var(--ink)}
.link{color:var(--brand);text-decoration:none}
.btn.ghost{color:var(--brand)}
.langsw button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.opt[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.qbar i{background:var(--brand)}
.cav,.badge.adm{background:var(--brand);color:var(--on-brand)}
.avatar.ph{background:var(--brand);color:var(--on-brand)}
.avatar{border-color:var(--line)}
.pbtn{border-color:var(--brand);color:var(--brand)}
.nav button[aria-current="page"]{color:var(--brand)}
.verdict.v-maybe{color:var(--brand)}
.badge.v-maybe{color:var(--brand)}
.ob .input,.ob select.input{border-color:var(--line)}

/* navy v4 */
:root{--g1:#1E3A8A;--g2:#1E3A8A;--navy:#1E3A8A}

:root[data-theme="dark"]{--g1:#1E40AF;--g2:#1E40AF}
.slab{background:var(--g1);color:#fff;box-shadow:none;
  --ink:#fff;--slab-soft:rgba(255,255,255,.86);--track:rgba(255,255,255,.3);--coin:#FFFFFF;--coin-ink:#1E3A8A;--brand:#fff;--on-brand:#1E3A8A}
.slab .tick{background:var(--g1)}
.slab .tick.hit{background:#fff;border-color:#fff}
.slab .icon-btn{background:rgba(255,255,255,.18);color:#fff}
.slab :focus-visible{outline-color:#fff}
.slab .avatar{border-color:rgba(255,255,255,.55)}
.slab .avatar.ph{background:#fff;color:#4F46E5}
.slab .pbtn{border-color:rgba(255,255,255,.75);color:#fff}
.btn,.fab{background:var(--brand);box-shadow:none}
.btn.ghost,.btn.danger{background:transparent}
.amt{padding:2px 10px;border-radius:999px;font-weight:700}
.amt.inc{background:rgba(22,163,74,.12)}
.amt.exp{background:rgba(220,38,38,.1)}
.day{color:var(--ink-2)}
.topbar{border-top:0}
.thumb,.player.ph{background:var(--g1);color:#fff}
.cav,.badge.adm,.avatar.ph{background:var(--g1);color:#fff}
.opt,.opt:nth-child(n){background:var(--surface);border-color:var(--line)}
.opt[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.qbar i{background:var(--brand)}
.verdict{padding:16px 18px;border-radius:18px;background:rgba(30,58,138,.08)}
.verdict.v-fit{background:rgba(22,163,74,.1)}
.verdict.v-wait{background:rgba(220,38,38,.08)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.h2{border-inline-start:0;padding-inline-start:0}
.nav button[aria-current="page"]{color:var(--brand)}
.pill[aria-pressed="true"],.chip input:checked + span,.like-btn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand)}
.ob{background:var(--g1);color:#fff}
.ob h1,.ob p{color:#fff}
.ob .input,.ob select.input{background:#fff;color:#0F172A;border-color:#fff}
.ob .field > span,.ob .check,.ob .back{color:#fff}
.ob .btn{background:#fff;color:#1E3A8A}
.ob .err{color:#FFE4E6;font-weight:700}

.ob .langsw button{border-color:rgba(255,255,255,.7);color:#fff}
.ob .langsw button[aria-pressed="true"]{background:#fff;color:#1E3A8A;border-color:#fff}

.home-hero{background:linear-gradient(135deg,#2563EB,#7C3AED);box-shadow:0 10px 30px rgba(79,70,229,.25)}
.home-hero .tick{background:#5B45E0}
.home-hero .tick.hit{background:#fff;border-color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .home-hero{background:linear-gradient(135deg,#1D4ED8,#6D28D9)}}
:root[data-theme="dark"] .home-hero{background:linear-gradient(135deg,#1D4ED8,#6D28D9)}
/* add-entry form: expense red, income green */
form[data-form="add"]{--acc:var(--exp)}
form[data-form="add"][data-type="inc"]{--acc:var(--inc)}
form[data-form="add"] .seg input:checked + span{background:var(--acc);color:#fff}
form[data-form="add"] .input.big{color:var(--acc);border-color:var(--acc)}
form[data-form="add"] .field > span{color:var(--ink-2)}
form[data-form="add"] .chip input:checked + span{background:var(--acc);border-color:var(--acc);color:#fff}
form[data-form="add"] #add-save{background:var(--acc);color:#fff}
form[data-form="add"] :focus-visible{outline-color:var(--acc)}

/* ---------- i18n helpers ---------- */
function isRtl(){ return langInfo(state.lang).dir==='rtl'; }
function locale(){ return langInfo(state.lang).locale; }
function t(key, vars){
  var s = (I18N[state.lang] && I18N[state.lang][key]);
  if(s === undefined) s = I18N.en[key];
  if(s === undefined) return key;
  if(vars){ s = s.replace(/\{(\w+)\}/g,function(m,k){return vars[k]!==undefined ? vars[k] : m;}); }
  return s;
}
function curInfo(){
  for(var i=0;i<CURS.length;i++){ if(CURS[i].code===state.cur) return CURS[i]; }
  return CURS[0];
}
function sym(){ return curInfo().sym; }
function catName(type, id){
  var list = CATS[type] || [];
  for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i][state.lang]; }
  return id;
}
function applyLocale(){
  var el = document.documentElement;
  el.setAttribute('lang', state.lang);
  el.setAttribute('dir', isRtl() ? 'rtl' : 'ltr');
  document.title = t('appTitle');
}

/* ---------- helpers ---------- */
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
}
function pad2(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function parseISO(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function todayISO(){return iso(new Date());}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function numText(agorot){
  var abs = Math.abs(agorot)/100;
  var frac = Math.round(Math.abs(agorot)) % 100 ? 2 : 0;
  return abs.toLocaleString(locale(),{minimumFractionDigits:frac,maximumFractionDigits:2});
}
function money(agorot, signed){
  var sign = '';
  if(signed === 'plus'){ sign = '+'; }
  else if(signed === 'minus'){ sign = '\u2212'; }
  else if(agorot < 0){ sign = '\u2212'; }
  return '<span class="num">'+sign+sym()+numText(agorot)+'</span>';
}
function compact(units){
  function trim(n){return String(Math.round(n*10)/10).replace(/\.0$/,'');}
  if(units >= 1e6) return sym()+trim(units/1e6)+'M';
  if(units >= 1e3) return sym()+trim(units/1e3)+'K';
  return sym()+trim(units);
}
function cnum(text){ return '<span class="num">'+text+'</span>'; }
function parseAmount(raw){
  var s = String(raw||'').replace(/[^\d.,]/g,'');
  if(!s) return null;
  if(s.indexOf(',')>-1 && s.indexOf('.')>-1){ s = s.replace(/,/g,''); }
  else if(s.indexOf(',')>-1){
    s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g,'') : s.replace(',','.');
  }
  if((s.match(/\./g)||[]).length > 1){ s = s.replace(/\./g,''); }
  var n = parseFloat(s);
  if(!isFinite(n)) return null;
  return Math.round(n*100);
}
function balance(){
  return state.tx.reduce(function(sum,x){return sum + (x.type==='inc' ? x.amount : -x.amount);}, state.start);
}
function greeting(){
  var h = new Date().getHours();
  if(h>=5 && h<12) return t('gMorning');
  if(h>=12 && h<17) return t('gAfternoon');
  return t('gEvening');
}
function sortedTx(){
  return state.tx.slice().sort(function(a,b){
    if(a.date !== b.date) return a.date < b.date ? 1 : -1;
    return b.ts - a.ts;
  });
}
function dayLabel(dateStr){
  var d = parseISO(dateStr), now = new Date();
  var t0 = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var diff = Math.round((t0 - d)/86400000);
  if(diff===0) return t('today');
  if(diff===1) return t('yesterday');
  var opts = {day:'numeric',month:'long'};
  if(d.getFullYear() !== t0.getFullYear()) opts.year = 'numeric';
  return new Intl.DateTimeFormat(locale(),opts).format(d);
}
function applyTheme(){
  var el = document.documentElement;
  if(state.theme==='light' || state.theme==='dark'){ el.setAttribute('data-theme',state.theme); }
  else { el.removeAttribute('data-theme'); }

/* ---------- ladder ---------- */
function ladderModel(bal){
  var G = Math.max(state.goal, 10000);
  var rungs = [G/1000, G/100, G/10, G];
  var pct;
  if(bal <= 0){ pct = 0; }
  else if(bal < rungs[0]){ pct = 25 * bal / rungs[0]; }
  else { pct = Math.min(100, 25 * (1 + Math.log10(bal / rungs[0]))); }
  var next = null;
  for(var i=0;i<rungs.length;i++){ if(bal < rungs[i]){ next = rungs[i]; break; } }
  return {rungs:rungs,pct:pct,next:next};
}
function renderLadder(bal){
  var m = ladderModel(bal);
  var ticks='', labels='';
  m.rungs.forEach(function(r,i){
    var pos = (i+1)*25;
    ticks += '<span class="tick'+(bal>=r?' hit':'')+'" style="inset-inline-start:'+pos+'%"></span>';
    labels += '<span class="num" style="inset-inline-start:'+pos+'%">'+compact(r/100)+'</span>';
  });
  var note;
  if(m.next === null){ note = t('ladderDone'); }
  else if(state.tx.length === 0 && bal <= 0){ note = t('ladderFirst'); }
  else if(bal < 0){ note = t('ladderNeg'); }
  else { note = t('ladderNext',{amt:money(m.next-bal),step:cnum(compact(m.next/100))}); }
  return '<div class="ladder" role="img" aria-label="'+esc(t('ladderAria'))+'">'+
    '<div class="track"><div class="fill" style="width:'+m.pct.toFixed(1)+'%"></div>'+ticks+'</div>'+
    '<div class="tick-labels">'+labels+'</div></div>'+
    '<p class="ladder-note">'+note+'</p>'+
    '<p class="goal-note">'+t('goalNote',{g:cnum(compact(Math.max(state.goal,10000)/100))})+'</p>';
}

var vidMem = {}, urlCache = {};

function idb(cb){
  try{
    var r = indexedDB.open('steps-videos',1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('v'); };
    r.onsuccess = function(){ cb(null,r.result); };
    r.onerror = function(){ cb(r.error); };
  }catch(e){ cb(e); }
}
function putBlob(id,blob,done){
  vidMem[id] = blob;
  idb(function(err,db){
    if(err){ done(false); return; }
    try{
      var tx = db.transaction('v','readwrite');
      tx.objectStore('v').put(blob,id);
      tx.oncomplete = function(){ done(true); };
      tx.onerror = function(){ done(false); };
    }catch(e){ done(false); }
  });
}
function getBlob(id,cb){
  if(vidMem[id]){ cb(vidMem[id]); return; }
  idb(function(err,db){
    if(err){ cb(null); return; }
    try{
      var rq = db.transaction('v').objectStore('v').get(id);
      rq.onsuccess = function(){ if(rq.result){ vidMem[id] = rq.result; } cb(rq.result || null); };
      rq.onerror = function(){ cb(null); };
    }catch(e){ cb(null); }
  });
}
function delBlob(id){
  delete vidMem[id];
  if(urlCache[id]){ try{ URL.revokeObjectURL(urlCache[id]); }catch(e){} delete urlCache[id]; }
  idb(function(err,db){
    if(err) return;
    try{ db.transaction('v','readwrite').objectStore('v').delete(id); }catch(e){}
  });
}

/* ---------- stats ---------- */
function getBuckets(period){
  var now = new Date();
  var t0 = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var list = [], keyOf, title;
  if(period==='week'){
    var wd = new Intl.DateTimeFormat(locale(),{weekday:isRtl()?'narrow':'short'});
    for(var i=6;i>=0;i--){
      var d = new Date(t0); d.setDate(t0.getDate()-i);
      list.push({key:iso(d),label:wd.format(d),inc:0,exp:0});
    }
    keyOf = function(x){return x.date;};
    title = t('last7');
  } else if(period==='month'){
    var y = t0.getFullYear(), m = t0.getMonth();
    var n = new Date(y,m+1,0).getDate();
    for(var dd=1;dd<=n;dd++){ list.push({key:iso(new Date(y,m,dd)),label:String(dd),inc:0,exp:0}); }
    keyOf = function(x){return x.date;};
    title = new Intl.DateTimeFormat(locale(),{month:'long',year:'numeric'}).format(t0);
  } else {
    var yy = t0.getFullYear();
    var ms = new Intl.DateTimeFormat(locale(),{month:'short'});
    for(var mm=0;mm<12;mm++){ list.push({key:yy+'-'+pad2(mm+1),label:ms.format(new Date(yy,mm,1)),inc:0,exp:0}); }
    keyOf = function(x){return x.date.slice(0,7);};
    title = String(yy);
  }
  var map = {};
  list.forEach(function(b){map[b.key]=b;});
  var inRange = [];
  state.tx.forEach(function(x){
    var b = map[keyOf(x)];
    if(b){ b[x.type] += x.amount; inRange.push(x); }
  });
  return {list:list,title:title,tx:inRange,period:period};
}

function chartSVG(b){
  var W=360,H=150,top=6,bot=20,ch=H-top-bot,n=b.list.length,slot=W/n;
  var rtl = isRtl();
  var max = 1;
  b.list.forEach(function(x){max=Math.max(max,x.inc,x.exp);});
  var bw = Math.max(2,Math.min(slot*0.34,14));
  var g = '<line class="base" x1="0" x2="'+W+'" y1="'+(top+ch)+'" y2="'+(top+ch)+'"/>';
  b.list.forEach(function(x,i){
    var cx = rtl ? W-(i+0.5)*slot : (i+0.5)*slot;
    var incX = rtl ? cx+0.5 : cx-bw-0.5;
    var expX = rtl ? cx-bw-0.5 : cx+0.5;
    if(x.inc){
      var hi = Math.max(2,Math.round(x.inc/max*ch));
      g += '<rect class="b-inc" x="'+incX.toFixed(1)+'" y="'+(top+ch-hi)+'" width="'+bw.toFixed(1)+'" height="'+hi+'" rx="2"/>';
    }
    if(x.exp){
      var he = Math.max(2,Math.round(x.exp/max*ch));
      g += '<rect class="b-exp" x="'+expX.toFixed(1)+'" y="'+(top+ch-he)+'" width="'+bw.toFixed(1)+'" height="'+he+'" rx="2"/>';
    }
    var show = b.period!=='month' || (i+1)===1 || (i+1)%5===0;
    if(show){ g += '<text x="'+cx.toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle">'+esc(x.label)+'</text>'; }
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t('chartAria'))+'">'+g+'</svg>';
}

function catBlock(title, txs, type){
  var sums = {};
  txs.filter(function(x){return x.type===type;}).forEach(function(x){sums[x.cat]=(sums[x.cat]||0)+x.amount;});
  var keys = Object.keys(sums).sort(function(a,b){return sums[b]-sums[a];});
  if(!keys.length) return '';
  var max = sums[keys[0]];
  return '<h2 class="h2">'+title+'</h2>'+keys.map(function(k){
    return '<div class="cat"><div class="cat-top"><span>'+esc(catName(type,k))+'</span><span>'+money(sums[k])+'</span></div>'+
      '<div class="cat-bar"><i class="'+type+'" style="width:'+Math.max(3,Math.round(sums[k]/max*100))+'%"></i></div></div>';
  }).join('');
}

function statsBody(){
  var b = getBuckets(statsPeriod);
  var inc=0, exp=0;
  b.list.forEach(function(x){inc+=x.inc;exp+=x.exp;});
  var net = inc-exp;
  var periods = [['week',t('week')],['month',t('month')],['year',t('year')]];
  var seg = '<div class="seg" role="group" aria-label="'+esc(t('choosePeriod'))+'">'+periods.map(function(p){
    return '<button data-act="period" data-arg="'+p[0]+'" aria-pressed="'+(statsPeriod===p[0])+'">'+p[1]+'</button>';
  }).join('')+'</div>';
  var content;
  if(!b.tx.length){
    content = '<div class="empty"><p>'+t('noEntriesPeriod')+'</p></div>';
  } else {
    content = '<div class="totals"><div><p class="k">'+t('incomePl')+'</p><p class="v inc">'+money(inc)+'</p></div>'+
      '<div><p class="k">'+t('expensePl')+'</p><p class="v exp">'+money(exp)+'</p></div>'+
      '<div><p class="k">'+t('net')+'</p><p class="v">'+money(net)+'</p></div></div>'+
      chartSVG(b)+
      '<div class="legend"><span><i style="background:var(--inc)"></i>'+t('incomePl')+'</span><span><i style="background:var(--exp)"></i>'+t('expensePl')+'</span></div>'+
      catBlock(t('byCat'), b.tx, 'exp')+
      catBlock(t('bySource'), b.tx, 'inc');
  }
  return seg+'<p class="range-title">'+esc(b.title)+'</p>'+content+'<p class="disclaimer">'+t('disclaimer')+'</p>';
}

function processAvatar(file){
  if(!file || !/^image\//.test(file.type||'')){ showToast(t('photoErr')); return; }
  var fr = new FileReader();
  fr.onerror = function(){ showToast(t('photoErr')); };
  fr.onload = function(){
    var img = new Image();
    img.onerror = function(){ showToast(t('photoErr')); };
    img.onload = function(){
      try{
        var s = 256, c = document.createElement('canvas'); c.width = s; c.height = s;
        var side = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,s,s);
        state.avatar = c.toDataURL('image/jpeg',0.85);
        save(); render(); showToast(t('photoSaved'));
      }catch(e){ showToast(t('photoErr')); }
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

    if(focusSel){ var fe = app.querySelector(focusSel); if(fe){ fe.focus({preventScroll:true}); } }
    return;
  }
  var body = view==='home' ? renderHome() : view==='money' ? renderMoney() : view==='consult' ? renderConsult() : view==='videos' ? renderVideos() : renderProfile();
  app.innerHTML = body + renderNav();
  attachPlayer();
  if(focusSel){
    var el = app.querySelector(focusSel);
    if(el){ el.focus({preventScroll:true}); }
  }
}

  'cmt-del': function(arg){

  'cmt-reply': function(arg, el){

function validCur(code){
  return CURS.some(function(c){return c.code===code;});
}

var forms = {
  'ob-email': function(f){
    var fd = new FormData(f), email = String(fd.get('email')||'').trim();
    var err = document.getElementById('ob-err');
    obDraft.email = email; obDraft.age = !!fd.get('age');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ err.textContent = t('errEmail'); return; }
    if(!obDraft.age){ err.textContent = t('errAge'); return; }
    state.email = email; save(); obStep = 1; render();
  },
  'ob-name': function(f){
    var name = String(new FormData(f).get('name')||'').trim();
    var err = document.getElementById('ob-err');
    if(!name){ err.textContent = t('errName'); return; }
    obDraft.name = name; state.name = name; save(); obStep = 2; render();
  },
  'ob-money': function(f){
    var fd = new FormData(f), err = document.getElementById('ob-err');
    obDraft.bal = String(fd.get('bal')||''); obDraft.goal = String(fd.get('goal')||'');
    var cur = String(fd.get('cur')||state.cur);
    var bal = obDraft.bal.trim()==='' ? 0 : parseAmount(obDraft.bal);
    var goal = parseAmount(obDraft.goal);
    if(bal===null || bal<0 || bal>1e11){ err.textContent = t('errBal'); return; }
    if(goal===null || goal<10000 || goal>1e12){ err.textContent = t('errGoal'); return; }
    if(validCur(cur)){ state.cur = cur; }
    state.start = bal; state.goal = goal; state.onboarded = true; save();
    view = 'home'; render();
  },
  'add': function(f){
    var fd = new FormData(f), err = document.getElementById('add-err');
    var type = fd.get('type'), amount = parseAmount(fd.get('amount'));
    var what = String(fd.get('what')||'').trim(), cat = fd.get('cat'), date = fd.get('date');
    if(amount===null || amount<=0){ err.textContent = t('errAmt'); return; }
    if(amount>1e11){ err.textContent = t('errBig'); return; }
    if(!what){ err.textContent = type==='inc' ? t('errEarn') : t('errSpend'); return; }
    if(!date || isNaN(parseISO(date).getTime())){ err.textContent = t('errDate'); return; }
    state.tx.push({id:newId(), ts:Date.now(), type:type, amount:amount, what:what, cat:cat, date:date});
    save(); closeSheet(); render();
    showToast(type==='inc' ? t('incAdded') : t('expAdded'));
  },
  'comment': function(f){
    var fd = new FormData(f), err = document.getElementById('cmt-err');
    var text = String(fd.get('text')||'').trim();
    var bad = checkComment(text);
    if(bad){ err.textContent = t(bad); return; }
    err.textContent = '';
    var vid = f.dataset.vid;
    if(!state.comments[vid]) state.comments[vid] = [];
    var par = activeReply();
    var nc = {id:newId(), name:state.name, text:text, ts:Date.now(), own:true, owner:!!state.owner};
    if(par){ nc.parent = par; }
    state.comments[vid].push(nc);
    replyTo = null;
    save(); refreshComments();
    if(f.reset) f.reset();
    showToast(t('cmtPosted'));
  },
  'upload': function(f){
    var fd = new FormData(f), err = document.getElementById('up-err');
    var file = fd.get('file'), title = String(fd.get('title')||'').trim(), desc = String(fd.get('desc')||'').trim();
    if(!file || !file.size){ err.textContent = t('errNoFile'); return; }
    if(String(file.type||'').indexOf('video/')!==0){ err.textContent = t('errNotVideo'); return; }
    if(file.size > 200*1024*1024){ err.textContent = t('errTooBig'); return; }
    if(!title){ err.textContent = t('errVTitle'); return; }
    var id = newId();
    putBlob(id, file, function(ok){
      state.videos.push({id:id, title:title, desc:desc, ts:Date.now()});
      save(); closeSheet(); view = 'videos'; videoOpen = null; render();
      showToast(ok ? t('vidSaved') : t('vidSession'));
    });
  },
  'goal-new': function(f){
    var fd = new FormData(f), err = document.getElementById('goal-err');
    var name = String(fd.get('name')||'').trim(), target = parseAmount(fd.get('target'));
    if(!name){ err.textContent = t('errGoalName'); return; }
    if(target===null || target<=0 || target>1e11){ err.textContent = t('errGoalTarget'); return; }
    state.goals.push({id:newId(), name:name, target:target, saved:0, ts:Date.now()});
    save(); closeSheet(); render(); showToast(t('goalCreated'));
  },
  'goal-add': function(f){
    var fd = new FormData(f), err = document.getElementById('goal-err');
    var amount = parseAmount(fd.get('amount'));
    var g = state.goals.filter(function(x){return x.id===f.dataset.goal;})[0];
    if(!g) return;
    if(amount===null || amount<=0 || amount>1e11){ err.textContent = t('errAmt'); return; }
    g.saved += amount;
    save(); closeSheet(); render(); showToast(t('goalAdded'));
  },
  'settings': function(f){
    var fd = new FormData(f), err = document.getElementById('set-err');
    var name = String(fd.get('name')||'').trim();
    var startRaw = String(fd.get('start')||'').trim();
    var start = startRaw==='' ? 0 : parseAmount(startRaw);
    var goal = parseAmount(fd.get('goal'));
    var lang = langInfo(String(fd.get('lang')||'')).code;
    var cur = String(fd.get('cur')||state.cur);
    /* errors stay in the language the sheet is currently shown in */
    if(!name){ err.textContent = t('errSetName'); return; }
    if(start===null || start<0 || start>1e11){ err.textContent = t('errStart'); return; }
    if(goal===null || goal<10000 || goal>1e12){ err.textContent = t('errGoal'); return; }
    state.lang = lang;
    state.name = name; state.start = start; state.goal = goal; state.theme = fd.get('theme') || 'auto';
    if(validCur(cur)){ state.cur = cur; }
    save(); closeSheet(); render();
    showToast(t('saved'));
  }
};

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var fn = actions[el.dataset.act];
  if(fn){ fn(el.dataset.arg, el, e); }
});
document.addEventListener('submit', function(e){
  e.preventDefault();
  var fn = forms[e.target.dataset.form];
  if(fn){ fn(e.target); }
});
document.addEventListener('change', function(e){
  var kind = e.target.dataset && e.target.dataset.change;
  if(kind==='type'){
    var type = e.target.value;
    if(e.target.form){ e.target.form.dataset.type = type; }
    document.getElementById('cats').innerHTML = catChips(type);
    document.getElementById('what-label').textContent = type==='inc' ? t('earnQ') : t('spendQ');
    var w = document.querySelector('#sheet-root input[name="what"]');
    w.placeholder = type==='inc' ? t('earnPh') : t('spendPh');
    document.getElementById('add-save').textContent = type==='inc' ? t('saveInc') : t('saveExp');
  } else if(kind==='avatar'){
    processAvatar(e.target.files && e.target.files[0]);
    e.target.value = '';
  } else if(kind==='step'){
    var pid = e.target.dataset.path, si = Number(e.target.value);
    togglePathStep(pid, si, !!e.target.checked);
    save(); render('[data-change="step"][data-path="'+pid+'"][value="'+si+'"]');
  } else if(kind==='cur-ob'){
    var code = e.target.value, info = CURS.filter(function(c){return c.code===code;})[0];
    if(info){
      obDraft.cur = code;
      document.getElementById('ob-bal-l').textContent = t('balLabel',{cur:info.sym});
      document.getElementById('ob-goal-l').textContent = t('goalLabel',{cur:info.sym});
    }
  }
});
document.addEventListener('keydown', function(e){
  if(!sheetOpen()) return;
  if(e.key==='Escape'){ closeSheet(); return; }
  if(e.key==='Tab'){
    var items = document.querySelectorAll('#sheet-root .sheet button, #sheet-root .sheet select, #sheet-root .sheet input:not(.vh), #sheet-root .sheet input.vh:checked');
    if(!items.length) return;
    var first = items[0], last = items[items.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});

  ACT_ORDER.forEach(function(id){ ACTS[id][code] = pack.acts[id]; });
  PATHS.forEach(function(p){ p[code] = pack.paths[p.id]; });

["اعثر على أول عميل","ابدأ بأشخاص تعرفهم وأعمال صغيرة في منطقتك. كن صريحًا بشأن خبرتك. إن كان عمرك أقل من 18 عامًا، تحدّث مع أحد والديك أو الوصي قبل قبول أي دفعة."],

["Начни создавать с помощью ИИ","Опиши приложение ИИ-инструменту и попроси простую первую версию. Двигайся небольшими шагами."],

["Учись и улучшай","Читай отзывы, сначала исправляй самую большую проблему и выпускай небольшие обновления."]]},

["Выбери тему","Выбери то, что тебе нравится и о чём можешь рассказать что-то полезное."],
["Реши, для кого это","Напиши одно предложение: кто смотрит и что получает от этого."],
["Придумай 10 идей для видео","Используй то, что узнал на этой неделе, проекты «до и после» и вопросы, которые тебе задают."],
["Сними первое простое видео","Телефон, естественный свет и чистый звук. Не дольше минуты. Не показывай свой адрес или школу."],
["Публикуй по графику и учись","Публикуй в ритме, который сможешь держать. Смотри, какие видео досматривают, а какие пропускают."],
["Расти шаг за шагом","Отвечай на комментарии, повторяй то, что работает, и учись у других. Рост медленный и не гарантирован."]]},

["Выбери навык, который нужен другим","Монтаж, дизайн, репетиторство, тексты или переводы. Выбери то, что получается лучше всего."],
["Сформулируй одно чёткое предложение","Скажи, что именно ты делаешь, сколько это занимает и как договариваются о цене."],
["Собери небольшое портфолио","Сделай 2-3 пробных проекта для друзей и сохрани результаты, чтобы показывать."],
["Найди первого клиента","Начни со знакомых и небольших местных компаний. Честно говори о своём опыте. Если тебе нет 18, поговори с родителем или опекуном, прежде чем принимать оплату."],
["Сдай работу, попроси отзыв и назначь цену","Сделай вовремя, спроси, что можно улучшить, а затем оцени следующую работу с учётом этого опыта."]]},
digital:{title:"Сделай цифровой продукт",desc:"Создай шаблон, руководство или инструмент, который решает небольшую проблему людей.",steps:[
["Найди, что ты можешь сделать","Шаблоны, учебные шпаргалки, чек-листы или пресеты. Выбери то, что решает небольшую проблему."],
["Проверь, нужно ли это людям","Спроси 5 человек, стали бы они этим пользоваться и сколько заплатили бы."],
["Сделай первую версию","Сделай самую маленькую полезную версию, например руководство на одной странице или шаблон."],
["Выбери, где продавать","Используй платформу, которая принимает платежи, и прочитай её правила о возрасте и комиссиях. Если тебе нет 18, сначала спроси родителя или опекуна."],
["Собери отзывы и улучшай","Спроси первых пользователей, чего не хватило, и обнови продукт."]]}
},

  var d = C[l], tgt = I18N[l];
  Object.keys(d.ui).forEach(function(k){ tgt[k] = d.ui[k]; });

/* ---------- consult ---------- */
var cView = 'list', cStep = 0, cDraft = null, cOpen = null;
var FREQ_USES = {daily:300, weekly3:120, weekly:50, rare:10};
function vKey(v){ return v==='fit' ? 'verdictFit' : v==='maybe' ? 'verdictMaybe' : 'verdictWait'; }
function vShort(v){ return v==='fit' ? 'vsFit' : v==='maybe' ? 'vsMaybe' : 'vsWait'; }

function analyze(c){
  var a = c.answers, pts = 0, pros = [], cons = [], low = false;
  var after = c.avail - c.price, net = c.avail - c.upcoming - c.price;
  function pro(k, p){ pts += p; pros.push({k:k}); }
  function con(k, p, v){ pts += p; cons.push({k:k, v:v}); }
  if(a.why==='work' || a.why==='study' || a.why==='content'){ pro('rfPurpose',2); } else if(a.why==='hobby'){ pts += 1; }
  if(a.need==='must'){ pro('rfNeed',3); } else if(a.need==='wait'){ pts += 1; }
  else if(a.need==='wantnot'){ con('raWantOnly',0); } else if(a.need==='cool'){ con('raWantOnly',-1); }
  if(a.have==='enough'){ con('raHave',-3); } else if(a.have==='notgood'){ pts += 1; } else if(a.have==='none'){ pro('rfNone',2); }
  if(a.freq==='daily'){ pro('rfFreq',2); } else if(a.freq==='weekly3'){ pro('rfFreq',1); } else if(a.freq==='rare'){ con('raRare',-2); }
  if(a.conseq==='cant'){ pro('rfConseq',3); } else if(a.conseq==='harder'){ pro('rfConseq',2); } else if(a.conseq==='nothing'){ con('raNothing',-2); }
  if(a.earn==='yes'){ pro('rfEarn',2); } else if(a.earn==='maybe'){ pts += 1; }
  if(a.prices==='yes'){ pro('rfPrices',1); } else if(a.prices==='no'){ con('raPrices',-1); }
  if(a.cheaper==='yes'){ con('raCheaper',-2); } else if(a.cheaper==='maybe'){ pts -= 1; } else if(a.cheaper==='no'){ pts += 1; }
  if(a.since==='now'){ con('raImpulse',-2); } else if(a.since==='days'){ pts -= 1; }
  else if(a.since==='weeks'){ pts += 1; } else if(a.since==='months'){ pro('rfLong',2); }
  var tooPricey = c.avail < c.price;
  if(tooPricey){ con('raNeg',-4); }
  else if(net < 0){ con('raLowUp',-3,{left:after, up:c.upcoming}); low = true; }
  else if(net < c.price*0.3){
    low = true;
    if(c.upcoming>0){ con('raLowUp',-2,{left:after, up:c.upcoming}); } else { con('raLow',-2,{left:after}); }
  } else if(net >= c.price*2){ pro('rfAfford',1); }
  var verdict = (pts>=7 && !low) || pts>=12 ? 'fit' : pts<=1 ? 'wait' : 'maybe';
  if(tooPricey){ verdict = 'wait'; }
  if(net<0 && verdict==='fit'){ verdict = 'maybe'; }
  var uses = FREQ_USES[a.freq] || 50;
  return {verdict:verdict, pros:pros, cons:cons, uses:uses, perUse:Math.round(c.price/uses), after:after, pts:pts};
}

function consultRow(c){
  var r = analyze(c);
  return '<li><button class="c-row" data-act="consult-open" data-arg="'+c.id+'"><span class="c-main"><span class="c-name">'+esc(c.product)+'</span>'+
    '<span class="small muted">'+money(c.price)+' · '+esc(dayLabel(iso(new Date(c.ts))))+'</span></span>'+
    '<span class="badge v-'+r.verdict+'">'+t(vShort(r.verdict))+'</span></button></li>';
}
function reasonText(r){
  var v = r.v ? {left:money(r.v.left), up:money(r.v.up||0)} : undefined;
  return esc(t(r.k, v));
}
function reasonList(title, list){
  return '<h2 class="h2">'+title+'</h2>'+(list.length
    ? '<ul class="reasons">'+list.map(function(r){return '<li>'+reasonText(r)+'</li>';}).join('')+'</ul>'
    : '<p class="muted">'+t('noneListed')+'</p>');
}
function renderConsultResult(c){
  var r = analyze(c), a = c.answers;
  var answers = CQ.filter(function(q){return !q.money;}).map(function(q){
    return '<li><span class="small muted">'+esc(t('q_'+q.id))+'</span><strong>'+esc(t('o_'+q.id+'_'+a[q.id]))+'</strong></li>';
  }).join('');
  return '<main class="app">'+topbar(t('resultTitle'))+'<div class="pad" style="padding-top:8px">'+
    '<button class="link" data-act="consult-list">'+t('backConsult')+'</button>'+
    '<p class="muted" style="margin-top:8px">'+t('priceLine',{product:esc(c.product),price:money(c.price)})+'</p>'+
    '<h1 class="verdict v-'+r.verdict+'">'+t(vKey(r.verdict))+'</h1>'+
    reasonList(t('forTitle'), r.pros)+reasonList(t('againstTitle'), r.cons)+
    '<div class="panel" style="margin-top:20px"><p><strong>'+t('costPerUse',{c:money(r.perUse)})+'</strong></p>'+
      '<p class="small muted">'+t('costAssume',{n:r.uses})+'</p>'+
      (r.after>=0 ? '<p style="margin-top:10px">'+t('leftAfter',{c:money(r.after)})+'</p>' : '')+
      ((c.inc30||c.exp30) ? '<p class="small muted" style="margin-top:6px">'+t('last30',{inc:money(c.inc30||0),exp:money(c.exp30||0)})+'</p>' : '')+
    '</div>'+
    (r.verdict!=='fit' ? '<p style="margin-top:14px">'+t('waitTip')+'</p>' : '')+
    ((c.answers.whose==='parents'||c.answers.whose==='gift') ? '<p style="margin-top:10px"><strong>'+t('parentsC')+'</strong></p>' : '')+
    '<p class="small muted" style="margin-top:14px">'+t('safetyC')+'</p>'+
    '<p class="small muted" style="margin-top:10px">'+t('consultDisc')+'</p>'+
    '<h2 class="h2">'+t('yourAnswers')+'</h2><ul class="ans">'+answers+'</ul>'+
    '<p style="margin-top:20px"><button class="btn danger" data-act="consult-del" data-arg="'+c.id+'">'+t('deleteConsult')+'</button></p>'+
  '</div></main>';
}
function renderConsult(){
  var head = function(){ return topbar(t('consultTitle')); };
  if(cView==='detail'){
    var c = state.consults.filter(function(x){return x.id===cOpen;})[0];
    if(c){ return renderConsultResult(c); }
    cView = 'list';
  }
  if(cView==='new'){
    return '<main class="app">'+head()+'<div class="pad" style="padding-top:8px">'+
      '<button class="link" data-act="consult-list">'+t('backConsult')+'</button>'+
      '<form data-form="consult-new" novalidate>'+
      '<label class="field"><span>'+t('productLabel')+'</span><input class="input" name="product" maxlength="40" placeholder="'+esc(t('productPh'))+'" value="'+esc(cDraft.product||'')+'"></label>'+
      '<label class="field"><span>'+t('priceLabel',{cur:esc(sym())})+'</span><input class="input big" name="price" dir="ltr" inputmode="decimal" autocomplete="off" placeholder="0" value="'+(cDraft.price?cDraft.price/100:'')+'"></label>'+
      '<p class="err" role="alert" id="consult-err"></p>'+
      '<button class="btn block" type="submit" style="margin-top:18px">'+t('startQuestions')+'</button></form></div></main>';
  }
  if(cView==='q'){
    var q = CQ[cStep], total = CQ.length;
    var inner;
    if(q.money){
      var av = cDraft.avail!==null && cDraft.avail!==undefined ? cDraft.avail : Math.max(0,balance());
      inner = '<h2 class="q-title">'+t('moneyTitle')+'</h2><form data-form="consult-money" novalidate>'+
        '<label class="field"><span>'+t('availLabel',{cur:esc(sym())})+'</span><input class="input big" name="avail" dir="ltr" inputmode="decimal" autocomplete="off" value="'+(av/100)+'"></label>'+
        '<p class="small muted">'+t('availHint')+'</p>'+
        '<label class="field"><span>'+t('upcomingLabel',{cur:esc(sym())})+'</span><input class="input big" name="upcoming" dir="ltr" inputmode="decimal" autocomplete="off" value="'+((cDraft.upcoming||0)/100)+'"></label>'+
        '<p class="small muted">'+t('upcomingHint')+'</p>'+
        '<p class="err" role="alert" id="consult-err"></p>'+
        '<button class="btn block" type="submit" style="margin-top:18px">'+t('next')+'</button></form>';
    } else {
      inner = '<h2 class="q-title">'+esc(t('q_'+q.id))+'</h2><div class="opts" role="group" aria-label="'+esc(t('q_'+q.id))+'">'+q.o.map(function(o){
        return '<button class="opt" data-act="consult-pick" data-arg="'+o+'" aria-pressed="'+(cDraft.answers[q.id]===o)+'">'+esc(t('o_'+q.id+'_'+o))+'</button>';
      }).join('')+'</div>';
    }
    return '<main class="app">'+head()+'<div class="pad" style="padding-top:8px">'+
      '<button class="link" data-act="consult-back">'+t('back')+'</button>'+
      '<p class="small muted">'+t('qCount',{n:cStep+1,total:total})+'</p>'+
      '<div class="qbar" aria-hidden="true"><i style="width:'+Math.round((cStep+1)/total*100)+'%"></i></div>'+inner+'</div></main>';
  }
  var rows = state.consults.map(consultRow).join('');
  return '<main class="app">'+head()+'<div class="pad" style="padding-top:16px">'+
    '<p class="muted">'+t('consultIntro')+'</p>'+
    '<p style="margin:14px 0 4px"><button class="btn" data-act="consult-start">'+icon('plus',20)+'<span>'+t('newCheck')+'</span></button></p>'+
    (rows ? '<h2 class="h2">'+t('consultHistory')+'</h2><ul class="list">'+rows+'</ul>' : '<div class="empty"><p>'+t('noConsults')+'</p></div>')+
    '<p class="small muted" style="margin-top:20px">'+t('consultDisc')+'</p></div></main>';
}
function cGo(){ render(); window.scrollTo(0,0); }
function last30(){
  var d = new Date(); d.setDate(d.getDate()-30);
  var cut = iso(d), inc = 0, exp = 0;
  state.tx.forEach(function(x){ if(x.date >= cut){ if(x.type==='inc'){ inc += x.amount; } else { exp += x.amount; } } });
  return {inc:inc, exp:exp};
}
function cAdvance(){
  if(cStep < CQ.length){ cGo(); return; }
  var l = last30();
  var c = {id:newId(), product:cDraft.product, price:cDraft.price, avail:cDraft.avail, upcoming:cDraft.upcoming,
           answers:cDraft.answers, inc30:l.inc, exp30:l.exp, ts:Date.now()};
  state.consults.unshift(c); save();
  cView = 'detail'; cOpen = c.id; cGo();
}
actions['consult-start'] = function(){ cDraft = {product:'', price:0, answers:{}, avail:null, upcoming:0}; cView = 'new'; cGo(); };
actions['consult-list'] = function(){ cView = 'list'; cGo(); };
actions['consult-open'] = function(arg){ cView = 'detail'; cOpen = arg; cGo(); };
actions['consult-back'] = function(){
  if(cStep > 0){ cStep--; } else { cView = 'new'; }
  cGo();
};
actions['consult-pick'] = function(arg){ cDraft.answers[CQ[cStep].id] = arg; cStep++; cAdvance(); };
actions['consult-del'] = function(arg){
  var i = state.consults.findIndex(function(x){return x.id===arg;});
  if(i<0) return;
  var removed = state.consults.splice(i,1)[0];
  save(); cView = 'list'; cGo();
  showToast(t('consultDeleted'), function(){ state.consults.unshift(removed); save(); render(); });
};
forms['consult-new'] = function(f){
  var fd = new FormData(f), err = document.getElementById('consult-err');
  var product = String(fd.get('product')||'').trim(), price = parseAmount(fd.get('price'));
  if(!product){ err.textContent = t('errProduct'); return; }
  if(price===null || price<=0 || price>1e11){ err.textContent = t('errPrice'); return; }
  cDraft.product = product; cDraft.price = price; cStep = 0; cView = 'q'; cGo();
};
forms['consult-money'] = function(f){
  var fd = new FormData(f), err = document.getElementById('consult-err');
  var av = parseAmount(fd.get('avail')), up = parseAmount(fd.get('upcoming'));
  if(up===null && String(fd.get('upcoming')||'').trim()===''){ up = 0; }
  if(av===null || up===null || av<0 || up<0 || av>1e12 || up>1e12){ err.textContent = t('errMoney'); return; }
  cDraft.avail = av; cDraft.upcoming = up; cStep++; cAdvance();
};

render();
/* ---------- splash ---------- */
(function(){
  var el = document.getElementById('splash');
  if(!el){ return; }
  var done = false;
  function hide(){
    if(done){ return; } done = true;
    el.classList.add('out');
    setTimeout(function(){ if(el.parentNode){ el.parentNode.removeChild(el); } }, 500);
  }
  el.addEventListener('click', hide);
  setTimeout(hide, 2000);
})();
})();
</script>
