<h1>בקשת מחיקת חשבון</h1>
<p>משתמשים באפליקציית Millionaire יכולים לבקש למחוק את החשבון ואת הנתונים האישיים המשויכים אליו.</p>
<p>כדי לבקש מחיקת חשבון, יש לפנות למפתח האפליקציה ולציין את הפרטים הדרושים לזיהוי החשבון.</p>
<p>הבקשה תטופל בהתאם לדרישות החוק ולמדיניות שמירת הנתונים של האפליקציה.</p>
